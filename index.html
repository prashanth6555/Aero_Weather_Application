<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aero is a live weather dashboard with current conditions, hourly and 7-day forecasts, and a sky that moves with the weather."
    />
    <meta name="theme-color" content="#8ecfff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1424" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Aero — Weather</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aero-theme');
          var theme = stored
            ? JSON.parse(stored)
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
